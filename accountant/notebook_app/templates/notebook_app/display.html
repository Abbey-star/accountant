<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ notebook.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f7f9fc; color: #202124; }
        .container { max-width: 960px; margin: 0 auto; }
        .cell { background: white; border: 1px solid #dfe1e5; border-radius: 10px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(60,64,67,.08); }
        .cell h2 { margin-top: 0; font-size: 1rem; color: #202124; }
        .code pre, .markdown pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
        .code { background: #f6f8fa; padding: 14px; border-radius: 8px; overflow-x: auto; }
        .error { padding: 16px; background: #ffe8e6; color: #9a1b0e; border: 1px solid #f1c0b4; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>{{ notebook.name }}</h1>
    {% if notebook.error %}
        <div class="error">{{ notebook.error }}</div>
    {% else %}
        {% for cell in notebook.cells %}
            <div class="cell {{ cell.type }}">
                <h2>{{ cell.type|capfirst }} cell</h2>
                {% if cell.type == "code" %}
                    <div class="code"><pre>{{ cell.source }}</pre></div>
                {% else %}
                    <div class="markdown"><pre>{{ cell.source }}</pre></div>
                {% endif %}
            </div>
        {% empty %}
            <div class="error">No notebook cells found.</div>
        {% endfor %}
    {% endif %}
</div>
</body>
</html>
